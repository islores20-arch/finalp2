<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Flores Car Care Tracker</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Inter',sans-serif;
    background:#070707;
    color:white;
    overflow-x:hidden;
}

/* Background Glow */

.glow1{
    position:fixed;
    width:600px;
    height:600px;
    background:rgba(255,0,0,0.15);
    filter:blur(160px);
    top:-200px;
    right:-100px;
    border-radius:50%;
    z-index:-1;
}

.glow2{
    position:fixed;
    width:500px;
    height:500px;
    background:rgba(255,255,255,0.05);
    filter:blur(180px);
    bottom:-200px;
    left:-100px;
    border-radius:50%;
    z-index:-1;
}

/* Header */

header{
    padding:30px 8%;
    display:flex;
    justify-content:space-between;
    align-items:center;

    position:sticky;
    top:0;

    backdrop-filter:blur(12px);

    background:rgba(10,10,10,0.75);

    border-bottom:1px solid rgba(255,255,255,0.05);
}

.logo{
    font-size:34px;
    font-weight:800;
}

.logo span{
    color:#ff2d2d;
}

.subtitle{
    color:#999;
    margin-top:4px;
    font-size:14px;
}

/* Layout */

.container{
    width:90%;
    max-width:1450px;
    margin:40px auto;
}

/* Stats */

.stats{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:18px;
    margin-bottom:25px;
}

.stat{
    background:rgba(20,20,20,0.9);
    border:1px solid rgba(255,255,255,0.05);

    padding:22px;
    border-radius:20px;

    transition:0.3s;
}

.stat:hover{
    transform:translateY(-5px);
    border-color:#ff2d2d;
}

.stat h3{
    color:#999;
    font-size:13px;
}

.stat p{
    font-size:34px;
    font-weight:700;
    margin-top:10px;
}

/* Grid */

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

/* Cards */

.card{
    background:rgba(20,20,20,0.95);
    border:1px solid rgba(255,255,255,0.05);

    border-radius:24px;
    padding:24px;

    box-shadow:
    0 0 20px rgba(0,0,0,0.25);
}

.card h2{
    margin-bottom:16px;
}

/* Inputs */

input,
select{
    width:100%;
    padding:15px;
    margin-top:12px;

    border:none;
    outline:none;

    border-radius:14px;

    background:#1b1b1b;
    color:white;

    transition:0.25s;
}

input:focus,
select:focus{
    border:1px solid #ff2d2d;
    transform:scale(1.01);
}

/* Button */

button{
    width:100%;
    padding:15px;
    margin-top:15px;

    border:none;
    border-radius:14px;

    background:linear-gradient(135deg,#ff1a1a,#990000);

    color:white;
    font-weight:700;

    cursor:pointer;

    transition:0.25s;
}

button:hover{
    transform:translateY(-3px);
}

/* Garage */

.garage{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(270px,1fr));
    gap:18px;
    margin-top:15px;
}

.vehicleCard{
    background:#121212;
    border-radius:20px;
    padding:20px;

    border:1px solid rgba(255,255,255,0.05);

    transition:0.3s;
}

.vehicleCard:hover{
    transform:translateY(-5px);
    border-color:#ff2d2d;
}

.vehicleCard h3{
    margin-bottom:8px;
    font-size:20px;
}

.vehicleCard p{
    color:#aaa;
    margin-top:6px;
    font-size:14px;
}

/* Maintenance */

.maintenanceCard{
    background:#121212;
    border-radius:18px;
    padding:18px;
    margin-top:15px;

    border:1px solid rgba(255,255,255,0.05);
}

.progress{
    width:100%;
    height:9px;

    background:#222;

    border-radius:20px;

    overflow:hidden;

    margin-top:12px;
}

.progressFill{
    height:100%;
    background:linear-gradient(90deg,#ff1a1a,#ff6b6b);
}

/* Status */

.good{
    color:#4dff91;
}

.warning{
    color:#ffd24d;
}

.bad{
    color:#ff4d4d;
}

/* Mobile */

@media(max-width:950px){

    .grid{
        grid-template-columns:1fr;
    }

}

</style>

</head>

<body>

<div class="glow1"></div>
<div class="glow2"></div>

<header>

    <div>

        <div class="logo">
            Flores <span>Car Care</span>
        </div>

        <div class="subtitle">
            Never Miss Your Car's Care Appointment
        </div>

    </div>

</header>

<div class="container">

<!-- Stats -->

<div class="stats">

    <div class="stat">
        <h3>Total Vehicles</h3>
        <p id="vehicleCount">0</p>
    </div>

    <div class="stat">
        <h3>Total Maintenance Records</h3>
        <p id="maintenanceCount">0</p>
    </div>

    <div class="stat">
        <h3>Total Garage Value</h3>
        <p id="garageValue">$0</p>
    </div>

</div>

<!-- Grid -->

<div class="grid">

    <!-- Add Vehicle -->

    <div class="card">

        <h2>Add Vehicle</h2>

        <input type="text" id="make" placeholder="Make">

        <input type="text" id="model" placeholder="Model">

        <input type="number" id="year" placeholder="Year">

        <input type="number" id="mileage" placeholder="Mileage">

        <button onclick="addVehicle()">
            Add Vehicle
        </button>

    </div>

    <!-- Add Maintenance -->

    <div class="card">

        <h2>Add Maintenance</h2>

        <select id="vehicleSelect">

            <option>Select Vehicle</option>

        </select>

        <select id="maintenanceType">

            <option>Oil Change</option>
            <option>Timing Belt</option>
            <option>Transmission Service</option>
            <option>Brake Service</option>
            <option>Spark Plugs</option>
            <option>Coolant Flush</option>
            <option>Power Steering Fluid</option>
            <option>Differential Fluid</option>
            <option>Battery Replacement</option>
            <option>Tire Rotation</option>
            <option>Air Filter</option>
            <option>Cabin Filter</option>

        </select>

        <input
        type="text"
        id="customMaintenance"
        placeholder="Custom Maintenance Type (Optional)">

        <input
        type="number"
        id="currentMileage"
        placeholder="Current Mileage">

        <input
        type="number"
        id="lastMileage"
        placeholder="Mileage At Last Service">

        <button onclick="addMaintenance()">
            Add Maintenance
        </button>

    </div>

</div>

<!-- Garage -->

<div class="card" style="margin-top:22px;">

    <h2>Your Garage</h2>

    <div class="garage" id="garage">

    </div>

</div>

<!-- Maintenance Timeline -->

<div class="card" style="margin-top:22px;">

    <h2>Maintenance Timeline</h2>

    <div id="maintenanceList">

    </div>

</div>

</div>

<script>

/* Totals */

let vehicleTotal = 0;
let maintenanceTotal = 0;
let garageWorth = 0;

/* Vehicle Value Calculator */

function calculateVehicleValue(make,year,mileage){

    let value = 26000;

    const luxuryBrands = [
        "acura",
        "lexus",
        "bmw",
        "audi",
        "infiniti",
        "mercedes",
        "tesla"
    ];

    if(
        luxuryBrands.includes(
            make.toLowerCase()
        )
    ){
        value += 8000;
    }

    let age = 2026 - year;

    value -= age * 1300;

    value -= mileage * 0.05;

    if(value < 2500){
        value = 2500;
    }

    return Math.round(value);

}

/* Add Vehicle */

function addVehicle(){

    let make =
    document.getElementById("make").value.trim();

    let model =
    document.getElementById("model").value.trim();

    let year =
    parseInt(
        document.getElementById("year").value
    );

    let mileage =
    parseInt(
        document.getElementById("mileage").value
    );

    if(
        make === "" ||
        model === "" ||
        isNaN(year) ||
        isNaN(mileage)
    ){

        alert("Please fill all fields.");

        return;

    }

    let estimatedValue =
    calculateVehicleValue(
        make,
        year,
        mileage
    );

    let vehicleName =
    `${year} ${make} ${model}`;

    vehicleTotal++;

    garageWorth += estimatedValue;

    document.getElementById("vehicleCount").innerText =
    vehicleTotal;

    document.getElementById("garageValue").innerText =
    "$" + garageWorth.toLocaleString();

    let card = `

        <div class="vehicleCard">

            <h3>${vehicleName}</h3>

            <p>
                Mileage:
                ${mileage.toLocaleString()} mi
            </p>

            <p>
                Estimated Trade-In Value:
                $${estimatedValue.toLocaleString()}
            </p>

        </div>

    `;

    document.getElementById("garage").innerHTML +=
    card;

    let option =
    document.createElement("option");

    option.text = vehicleName;

    document.getElementById("vehicleSelect")
    .add(option);

    /* Clear */

    document.getElementById("make").value = "";
    document.getElementById("model").value = "";
    document.getElementById("year").value = "";
    document.getElementById("mileage").value = "";

}

/* Add Maintenance */

function addMaintenance(){

    let vehicle =
    document.getElementById("vehicleSelect").value;

    let selectedType =
    document.getElementById("maintenanceType").value;

    let customType =
    document.getElementById("customMaintenance").value.trim();

    let maintenanceType =
    customType || selectedType;

    let currentMileage =
    parseInt(
        document.getElementById("currentMileage").value
    );

    let lastMileage =
    parseInt(
        document.getElementById("lastMileage").value
    );

    if(
        vehicle === "Select Vehicle" ||
        isNaN(currentMileage) ||
        isNaN(lastMileage)
    ){

        alert("Please complete all maintenance fields.");

        return;

    }

    maintenanceTotal++;

    document.getElementById("maintenanceCount").innerText =
    maintenanceTotal;

    /* Intervals */

    let interval = 30000;

    const intervals = {

        "Oil Change":5000,
        "Timing Belt":100000,
        "Transmission Service":40000,
        "Brake Service":30000,
        "Spark Plugs":60000,
        "Coolant Flush":50000,
        "Power Steering Fluid":50000,
        "Differential Fluid":40000,
        "Battery Replacement":50000,
        "Tire Rotation":6000,
        "Air Filter":15000,
        "Cabin Filter":15000

    };

    if(intervals[maintenanceType]){
        interval = intervals[maintenanceType];
    }

    let used =
    currentMileage - lastMileage;

    let remaining =
    interval - used;

    if(remaining < 0){
        remaining = 0;
    }

    let progress =
    (used / interval) * 100;

    if(progress > 100){
        progress = 100;
    }

    let status = "GOOD";
    let statusClass = "good";

    if(remaining === 0){

        status = "OVERDUE";
        statusClass = "bad";

    }
    else if(
        remaining < interval * 0.2
    ){

        status = "DUE SOON";
        statusClass = "warning";

    }

    let maintenanceCard = `

        <div class="maintenanceCard">

            <h3>${maintenanceType}</h3>

            <p>${vehicle}</p>

            <p class="${statusClass}">
                Remaining:
                ${remaining.toLocaleString()} miles
            </p>

            <div class="progress">

                <div
                class="progressFill"
                style="width:${progress}%">
                </div>

            </div>

            <p
            class="${statusClass}"
            style="margin-top:10px;">

                ${status}

            </p>

        </div>

    `;

    document.getElementById("maintenanceList").innerHTML +=
    maintenanceCard;

    /* Clear */

    document.getElementById("customMaintenance").value = "";
    document.getElementById("currentMileage").value = "";
    document.getElementById("lastMileage").value = "";

}

</script>

</body>

</html>
